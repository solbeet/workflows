[project]
name = "fixture-backend"
version = "0.1.0"
description = "Backend mínimo para el selftest de los workflows reutilizables."
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115"]

[dependency-groups]
dev = ["httpx>=0.28", "pyright>=1.1.400", "pytest>=8.3", "ruff>=0.11"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pyright]
include = ["app", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "standard"

[tool.pytest.ini_options]
testpaths = ["tests"]
