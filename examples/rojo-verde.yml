# Ejemplo para un repo cliente: copiar a .github/workflows/rojo-verde.yml.
# Check resultante (candidato a requerido para el merge automático): "solbeet / rojo-verde".
# Cada test nuevo de Python tiene que fallar sin el cambio y pasar con él.
name: rojo-verde

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read
  pull-requests: read
  issues: read
  actions: read

jobs:
  rojo-verde:
    name: solbeet
    uses: solbeet/workflows/.github/workflows/rojo-verde.yml@v1
    with:
      backend-dir: backend
