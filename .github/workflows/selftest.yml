# Autoverificación del repo: lintea los workflows y llama a los reutilizables
# con ruta local (./.github/workflows/...) contra el fixture de tests/fixture/.
# Así cada PR prueba la versión de los workflows que trae el propio PR.
name: selftest

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: selftest-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Versión fijada de actionlint y checksum SHA-256 del release
  # (actionlint_1.7.12_checksums.txt). Ver docs/decisiones/0003-escaner-de-secretos-y-versiones-fijadas.md.
  ACTIONLINT_VERSION: 1.7.12
  ACTIONLINT_SHA256_LINUX_AMD64: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8

jobs:
  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Instalar actionlint (versión fijada, checksum verificado)
        run: |
          dir="$RUNNER_TEMP/actionlint"
          mkdir -p "$dir"
          file="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSL --retry 3 -o "$dir/$file" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${file}"
          echo "${ACTIONLINT_SHA256_LINUX_AMD64}  $dir/$file" | sha256sum -c -
          tar -xzf "$dir/$file" -C "$dir" actionlint
          echo "$dir" >> "$GITHUB_PATH"

      - name: actionlint
        # Los ejemplos se lintean junto con los workflows reales: son lo que copian los clientes.
        run: actionlint -color .github/workflows/*.yml examples/*.yml

  hygiene-logic:
    name: hygiene-logic
    # Prueba los casos que deben fallar (falta una sección, .rej, conflictos),
    # que no se pueden ejercitar llamando al workflow reutilizable.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Instalar uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          # Solo se usa para un script suelto; no hay lockfile que cachear.
          enable-cache: false

      - name: Casos de pr-hygiene
        run: uv run --no-project --with pyyaml==6.0.2 python tests/hygiene/test_pr_hygiene.py

      - name: Casos de gates (veredictos de squawk, contrato y dependencias)
        run: uv run --no-project --with pyyaml==6.0.2 python tests/gates/test_gates.py

      - name: Casos de la guardia de tests
        run: uv run --no-project --with pyyaml==6.0.2 python tests/guardia/test_guardia.py

      - name: Casos de rojo → verde (uv y pytest de verdad sobre el fixture)
        run: uv run --no-project --with pyyaml==6.0.2 python tests/rojo_verde/test_rojo_verde.py

  ci:
    name: ci
    uses: ./.github/workflows/python-react.yml
    with:
      backend-dir: tests/fixture/backend
      frontend-dir: tests/fixture/frontend

  ci-postgres:
    name: ci-postgres
    # Ejercita el servicio Postgres y el salteo del job frontend con frontend-dir vacío.
    uses: ./.github/workflows/python-react.yml
    with:
      backend-dir: tests/fixture/backend
      frontend-dir: ""
      postgres: true

  pr-hygiene:
    name: pr-hygiene
    if: github.event_name == 'pull_request'
    uses: ./.github/workflows/pr-hygiene.yml

  gates:
    name: gates
    # Ejercita los cuatro jobs contra el fixture: cobertura del cambio, migraciones
    # (el fixture no usa Alembic: tiene que saltear con aviso), contrato con la app
    # del fixture levantada en el runner y dependencias sobre sus lockfiles.
    if: github.event_name == 'pull_request'
    uses: ./.github/workflows/gates.yml
    with:
      backend-dir: tests/fixture/backend
      contract-app: app.main:app

  guardia-tests:
    name: guardia-tests
    # Corre la guardia sobre el propio PR: los PRs de este repo no tocan tests
    # existentes salvo que lo digan, así que tiene que dar verde.
    if: github.event_name == 'pull_request'
    uses: ./.github/workflows/guardia-tests.yml
    permissions:
      contents: read
      pull-requests: read
      issues: read
      actions: read

  rojo-verde:
    name: rojo-verde
    # Sobre el propio PR: el backend del fixture rara vez gana tests nuevos, así que
    # lo normal es "no aplica". Los casos que deben fallar están en hygiene-logic.
    if: github.event_name == 'pull_request'
    uses: ./.github/workflows/rojo-verde.yml
    permissions:
      contents: read
      pull-requests: read
      issues: read
      actions: read
    with:
      backend-dir: tests/fixture/backend
