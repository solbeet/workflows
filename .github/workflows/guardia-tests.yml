# Guardia de tests (fase V, ítem V2).
#
# Un agente que no logra pasar un test tiende a cambiar el test en vez del código
# (ImpossibleBench, 2025: en Claude más del 79% de las trampas fueron editar tests).
# Este check lo frena de forma determinista, sin juez LLM. Falla si el PR:
#
#   - borra un archivo de tests o un test que existía;
#   - debilita un test existente: le saca o le cambia un assert, un self.assert* o
#     mock.assert_*, un pytest.raises/warns o un caso de @pytest.mark.parametrize
#     (cambiar el valor esperado cuenta). Se compara el árbol sintáctico, así que
#     reformatear o cambiar comentarios no cuenta. En otros lenguajes: borrar o
#     reemplazar una línea con expect(/assert en un archivo de tests existente;
#   - saltea tests existentes: skip/xfail en un test que ya estaba, a nivel módulo
#     (pytestmark) o en conftest.py, o .only/.skip/xit en vitest, jest o mocha;
#   - toca un archivo existente de `tests/aceptacion/` (los tests que salen de los
#     criterios de la spec). Agregar archivos nuevos ahí sí se puede.
#
# Cambiar setup, fixtures o helpers de un test existente no es violación (pasa
# seguido cuando cambia la spec y medido sobre PRs reales daba falsos positivos);
# eso lo mira el revisor. Los salteos dentro de tests nuevos los frena rojo-verde.yml.
#
# Agregar tests nuevos, en archivos nuevos o existentes, siempre está permitido.
#
# Vía de escape: una persona revisa el cambio y pone el label `override-label`
# (default `tests-con-dale`). Vale solo si lo puso una persona (no un bot), que no es
# el autor del PR, y después del último push: si el PR cambia después, el label ya
# no alcanza y hay que volver a ponerlo. Cada uso queda en el resumen del job.
#
# El nombre del job (`tests`) es parte del contrato (ADR 0002): cambiarlo es v2.
name: guardia-tests

on:
  workflow_call:
    inputs:
      test-paths:
        description: Patrones (fnmatch, uno por línea) de los archivos que cuentan como tests.
        type: string
        default: |
          tests/*
          */tests/*
          test/*
          */test/*
          */__tests__/*
          test_*.py
          */test_*.py
          *_test.py
          conftest.py
          */conftest.py
          *.test.*
          *.spec.*
      acceptance-dir:
        description: Directorio de los tests de aceptación (criterios de la spec). Se busca como segmento de ruta en cualquier nivel.
        type: string
        default: tests/aceptacion
      override-label:
        description: Label que pone una persona para aceptar el cambio en los tests (dale humano).
        type: string
        default: tests-con-dale
      override-approvers:
        description: Logins (separados por espacios) que pueden dar el dale. Vacío = cualquier persona que no sea el autor del PR ni un bot.
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: guardia-tests-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Lectura de los eventos del PR (quién puso el label y cuándo) y de las corridas
    # del commit (cuándo llegó el último push). No escribe nada.
    permissions:
      contents: read
      pull-requests: read
      issues: read
      actions: read
    defaults:
      run:
        shell: bash
    steps:
      - name: Verificar evento
        if: github.event_name != 'pull_request'
        run: |
          echo "::error::guardia-tests solo funciona con el evento pull_request (recibido: ${GITHUB_EVENT_NAME})."
          exit 1

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # El commit de merge y sus padres: HEAD^1 = base, HEAD^2 = punta del PR.
          fetch-depth: 2
          persist-credentials: false

      - name: Cambios en tests existentes
        env:
          TEST_PATHS: ${{ inputs.test-paths }}
          ACCEPTANCE_DIR: ${{ inputs.acceptance-dir }}
        shell: python3 {0}
        run: |
          """Compara los tests de la base (HEAD^1) con los del PR (HEAD) y anota violaciones.

          Escribe la lista en $RUNNER_TEMP/guardia.json; el paso siguiente decide si
          alcanza con el dale humano. Este paso no falla por las violaciones.

          Qué es una violación (Python, por árbol sintáctico):
            borra       un test (test_* o Test*.test_*) que existía ya no está;
            debilita    un test que existía perdió un assert, un self.assert*/mock.assert_*,
                        un pytest.raises/warns o un caso de @pytest.mark.parametrize, o
                        uno de esos cambió (cambiar el valor esperado cuenta);
            saltea      un test existente gana skip/xfail (también con alias: `from
                        pytest import mark`, `import pytest as pt`), o aparece un salteo a nivel
                        módulo o en conftest.py (afecta a tests existentes);
            aceptacion  cambia un archivo existente de tests de aceptación.
          Cambiar setup, fixtures, helpers o agregar asserts y tests no es violación.
          Otros lenguajes (por líneas): borrar o reemplazar una línea con expect(/assert
          de un archivo de tests existente, o agregar .only/.skip/xit/fit.
          """
          import ast
          import fnmatch
          import json
          import os
          import re
          import subprocess
          from collections import Counter

          patterns = [p.strip() for p in os.environ.get("TEST_PATHS", "").splitlines() if p.strip()]
          acceptance = os.environ.get("ACCEPTANCE_DIR", "").strip().strip("/")

          SKIP_JS = re.compile(r"\b(it|test|describe|suite)\.(only|skip|todo|fails)\b|\b(xit|xtest|xdescribe|fit|fdescribe)\s*\(")
          ASSERT_JS = re.compile(r"\bexpect\s*\(|\bassert\b|\.should\b|toMatchSnapshot|toThrow")
          SKIP_ATTR = re.compile(
              r"(pytest\.mark\.(skip|skipif|xfail)|pytest\.(skip|xfail|importorskip)"
              r"|unittest\.(skip|skipIf|skipUnless|expectedFailure|SkipTest)|.*\.skipTest)"
          )
          SKIP_NAMES = {"skip", "skipIf", "skipUnless", "expectedFailure", "SkipTest", "xfail", "importorskip"}

          def git(*args):
              return subprocess.run(["git", *args], capture_output=True, text=True, check=True).stdout

          def is_test(path):
              return any(fnmatch.fnmatch(path, p) for p in patterns)

          def in_acceptance(path):
              return bool(acceptance) and (path.startswith(acceptance + "/") or f"/{acceptance}/" in path)

          def show(rev, path):
              try:
                  return git("show", f"{rev}:{path}")
              except subprocess.CalledProcessError:
                  return None

          def short(node):
              return ast.unparse(node).replace("\n", " ")[:120]

          def aliases_of(tree):
              """{nombre local: nombre completo} de los imports del módulo.

              Cubre `import pytest as pt`, `from pytest import mark`, `from pytest
              import mark as m` y `from unittest import skip as s`, para que un
              salteo escrito con un alias se reconozca igual que el nombre completo.
              """
              out = {}
              for n in ast.walk(tree):
                  if isinstance(n, ast.Import):
                      for a in n.names:
                          if a.asname:
                              out[a.asname] = a.name
                  elif isinstance(n, ast.ImportFrom) and n.module and not n.level:
                      for a in n.names:
                          if a.name != "*":
                              out[a.asname or a.name] = f"{n.module}.{a.name}"
              return out

          def canonical(dotted, aliases):
              """Reemplaza el primer tramo de `a.b.c` por su nombre completo si es un alias."""
              head, dot, rest = dotted.partition(".")
              return aliases[head] + dot + rest if head in aliases else dotted

          def skips_in(node, aliases):
              """Salteos reales (atributos, nombres) dentro de un nodo; los strings no cuentan."""
              out = []
              for n in ast.walk(node):
                  if isinstance(n, ast.Attribute):
                      full = canonical(ast.unparse(n), aliases)
                      if SKIP_ATTR.fullmatch(full):
                          out.append(full)
                  elif isinstance(n, ast.Name):
                      full = canonical(n.id, aliases)
                      if full != n.id and SKIP_ATTR.fullmatch(full):
                          out.append(full)
                      elif n.id in SKIP_NAMES:
                          out.append(n.id)
              return out

          def profile(fn):
              """Lo que un test verifica: asserts, aserciones por llamada, raises y casos."""
              checks = Counter()
              for n in ast.walk(fn):
                  if isinstance(n, ast.Assert):
                      checks[short(n)] += 1
                  elif isinstance(n, ast.Call) and isinstance(n.func, ast.Attribute) and n.func.attr.startswith("assert"):
                      checks[short(n)] += 1
                  elif isinstance(n, (ast.With, ast.AsyncWith)):
                      for item in n.items:
                          expr = ast.unparse(item.context_expr)
                          if re.search(r"\b(raises|warns|assertRaises\w*|assertWarns\w*)\s*\(", expr):
                              checks[f"with {short(item.context_expr)}"] += 1
              for dec in getattr(fn, "decorator_list", []):
                  if isinstance(dec, ast.Call) and ast.unparse(dec.func).endswith("mark.parametrize") and len(dec.args) >= 2:
                      values = dec.args[1]
                      if isinstance(values, (ast.List, ast.Tuple)):
                          for elt in values.elts:
                              checks[f"caso {short(elt)}"] += 1
              return checks

          def tests_of(tree):
              """{nombre: FunctionDef} de tests (funciones test* y métodos test* de Test*)."""
              out = {}
              for node in tree.body:
                  if isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef)) and node.name.startswith("test"):
                      out[node.name] = node
                  elif isinstance(node, ast.ClassDef) and node.name.startswith("Test"):
                      for item in node.body:
                          if isinstance(item, (ast.FunctionDef, ast.AsyncFunctionDef)) and item.name.startswith("test"):
                              out[f"{node.name}.{item.name}"] = item
              return out

          violations = []

          def add(path, kind, detail):
              violations.append({"archivo": path, "tipo": kind, "detalle": detail})

          def compare_python(path, old, new, is_new_file):
              """Devuelve False si algún lado no parsea (se usa el criterio por líneas)."""
              try:
                  t_new = ast.parse(new)
                  t_old = ast.parse(old) if old else ast.parse("")
              except SyntaxError:
                  return False
              before, after = tests_of(t_old), tests_of(t_new)
              al_old, al_new = aliases_of(t_old), aliases_of(t_new)
              for name, fn in before.items():
                  if name not in after:
                      add(path, "borra", f"`{name}` existía en la base y el PR lo saca")
                      continue
                  lost = profile(fn) - profile(after[name])
                  for check in lost:
                      add(path, "debilita", f"`{name}` pierde o cambia `{check}`")
                  new_skips = Counter(skips_in(after[name], al_new)) - Counter(skips_in(fn, al_old))
                  for s in new_skips:
                      add(path, "saltea", f"`{name}` (existente) ahora usa `{s}`")
              # Salteos fuera de los tests: a nivel módulo (pytestmark) o en conftest.py.
              conftest = os.path.basename(path) == "conftest.py"
              old_dumps = Counter(ast.dump(n) for n in t_old.body)
              for node in t_new.body:
                  if isinstance(node, (ast.Import, ast.ImportFrom)) or old_dumps[ast.dump(node)] > 0:
                      continue
                  is_test_def = isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef, ast.ClassDef)) and (
                      node.name.startswith("test") or node.name.startswith("Test"))
                  if is_test_def or (isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef, ast.ClassDef)) and not conftest):
                      continue  # tests nuevos y helpers: los salteos de tests nuevos los ve rojo-verde
                  if is_new_file and not conftest:
                      continue  # pytestmark en un archivo nuevo solo afecta a tests nuevos
                  for s in skips_in(node, al_new):
                      add(path, "saltea", f"agrega `{s}` fuera de un test (línea {node.lineno}): afecta a tests existentes")
              return True

          def diff_lines(old_path, new_path, sign):
              diff = git("diff", "-U0", "--no-color", "HEAD^1", "HEAD", "--", old_path, new_path)
              head = "---" if sign == "-" else "+++"
              return [l[1:] for l in diff.splitlines() if l.startswith(sign) and not l.startswith(head)]

          for line in git("diff", "--name-status", "-M", "HEAD^1", "HEAD").splitlines():
              parts = line.split("\t")
              status = parts[0]
              old, new = (parts[1], parts[2]) if status.startswith("R") else (parts[1], parts[1])
              if not (is_test(old) or is_test(new)):
                  continue
              kind = status[0]
              if kind == "D":
                  add(old, "borra", "el PR borra un archivo de tests que existía")
                  continue
              if status == "R100":
                  continue  # mover sin cambios
              if kind in "MR" and (in_acceptance(old) or in_acceptance(new)):
                  add(new, "aceptacion", "cambia un test de aceptación existente (criterios de la spec)")
              before = show("HEAD^1", old) if kind in "MR" else ""
              after = show("HEAD", new) or ""
              if new.endswith(".py") and compare_python(new, before or "", after, kind == "A"):
                  continue
              if kind in "MR":
                  gone = [l for l in diff_lines(old, new, "-") if ASSERT_JS.search(l)]
                  if gone:
                      add(new, "debilita", f"borra o reemplaza {len(gone)} línea(s) con verificaciones, la primera: `{gone[0].strip()[:120]}`")
              for added in diff_lines(old, new, "+"):
                  if SKIP_JS.search(added):
                      add(new, "saltea", f"agrega `{added.strip()[:120]}`")

          with open(os.path.join(os.environ["RUNNER_TEMP"], "guardia.json"), "w") as f:
              json.dump(violations, f, ensure_ascii=False, indent=2)
          if violations:
              for v in violations:
                  print(f"::warning file={v['archivo']}::{v['tipo']}: {v['detalle']}")
          else:
              print("El PR no borra, debilita ni saltea tests existentes.")

      - name: Dale humano para los cambios en tests
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          OVERRIDE_LABEL: ${{ inputs.override-label }}
          OVERRIDE_APPROVERS: ${{ inputs.override-approvers }}
          API_URL: ${{ github.api_url }}
        shell: python3 {0}
        run: |
          """Decide el check: verde si no hay violaciones o si una persona dio el dale.

          El dale es el label OVERRIDE_LABEL, válido si: lo puso una persona (no un
          bot), no es el autor del PR, está en OVERRIDE_APPROVERS (si se configuró) y
          lo puso después de que GitHub recibió el commit actual (primera corrida de
          Actions para HEAD_SHA). Las fechas son del servidor de GitHub, no de git.
          """
          import json
          import os
          import sys
          import urllib.request

          temp = os.environ["RUNNER_TEMP"]
          violations = json.load(open(os.path.join(temp, "guardia.json")))
          summary = open(os.environ["GITHUB_STEP_SUMMARY"], "a")
          summary.write("## Guardia de tests\n\n")
          if not violations:
              summary.write("El PR no borra, debilita ni saltea tests existentes.\n")
              sys.exit(0)

          summary.write("| Archivo | Qué hace | Detalle |\n|---|---|---|\n")
          nombres = {"borra": "borra", "debilita": "debilita", "saltea": "saltea", "aceptacion": "toca aceptación"}
          for v in violations:
              summary.write(f"| `{v['archivo']}` | {nombres.get(v['tipo'], v['tipo'])} | {v['detalle']} |\n")

          label = os.environ["OVERRIDE_LABEL"]
          author = os.environ["PR_AUTHOR"]
          approvers = set(os.environ.get("OVERRIDE_APPROVERS", "").split())

          def api(path):
              # Hook de prueba: tests/guardia lo usa para no llamar a GitHub.
              fake = os.environ.get("GUARDIA_FAKE_API")
              if fake:
                  with open(os.path.join(fake, path.split("?")[0].strip("/").replace("/", "_") + ".json")) as f:
                      return json.load(f)
              req = urllib.request.Request(
                  f"{os.environ['API_URL']}{path}",
                  headers={"Authorization": f"Bearer {os.environ['GH_TOKEN']}", "Accept": "application/vnd.github+json"},
              )
              with urllib.request.urlopen(req, timeout=30) as r:
                  return json.load(r)

          def paginated(path):
              out, page = [], 1
              while True:
                  sep = "&" if "?" in path else "?"
                  chunk = api(f"{path}{sep}per_page=100&page={page}")
                  items = chunk.get("workflow_runs", []) if isinstance(chunk, dict) else chunk
                  out.extend(items)
                  if len(items) < 100 or os.environ.get("GUARDIA_FAKE_API"):
                      return out
                  page += 1

          repo, number, sha = os.environ["REPO"], os.environ["PR_NUMBER"], os.environ["HEAD_SHA"]
          motivo = None
          try:
              events = paginated(f"/repos/{repo}/issues/{number}/events")
              last = None
              for e in events:
                  if e.get("label", {}).get("name") != label:
                      continue
                  last = e if e.get("event") == "labeled" else None if e.get("event") == "unlabeled" else last
              runs = paginated(f"/repos/{repo}/actions/runs?head_sha={sha}")
              pushed = min((r["created_at"] for r in runs), default=None)
          except Exception as exc:  # sin API no hay forma de validar el dale: se falla cerrado
              last, pushed = None, None
              motivo = f"no se pudo consultar la API de GitHub ({exc})"

          ok = False
          if motivo is None and last is None:
              motivo = f"nadie puso el label `{label}`"
          elif last is not None:
              actor = last.get("actor") or {}
              login = actor.get("login", "")
              if actor.get("type") == "Bot" or login.endswith("[bot]"):
                  motivo = f"el label lo puso un bot ({login})"
              elif login == author:
                  motivo = f"el label lo puso el autor del PR ({login}); tiene que ser otra persona"
              elif approvers and login not in approvers:
                  motivo = f"{login} no está entre quienes pueden dar el dale ({', '.join(sorted(approvers))})"
              elif pushed is None or last["created_at"] < pushed:
                  motivo = f"el label es de antes del último push ({last['created_at']}); hay que volver a ponerlo"
              else:
                  ok = True
                  summary.write(f"\n**Aceptado con dale humano:** {login} puso `{label}` el {last['created_at']}.\n")
                  print(f"::notice::Cambios en tests aceptados por {login} (label {label}).")

          if not ok:
              summary.write(
                  f"\n**Frenado.** Este PR borra, debilita o saltea tests que ya existían. Si el cambio es legítimo (la spec cambió, "
                  f"el test estaba mal), una persona que no sea el autor lo revisa y pone el label `{label}`. "
                  f"Motivo por el que no alcanza hoy: {motivo}.\n"
              )
              print(f"::error::El PR borra, debilita o saltea tests existentes y no tiene dale humano: {motivo}.")
              sys.exit(1)
