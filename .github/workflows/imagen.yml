# Construye y publica la imagen de un servicio en GitHub Container Registry.
#
# La imagen queda en ghcr.io/<owner del repo>/<imagen> con dos tags:
# la versión sin la "v" cuando el disparo es un tag semver (v0.4.0 -> 0.4.0)
# y `sha-<sha7>` siempre. No publica `latest`: los consumidores (solbeet-infra,
# charts) fijan la versión. Usa el GITHUB_TOKEN del workflow que llama, que
# necesita `packages: write`; no hace falta ningún secreto.
name: imagen

on:
  workflow_call:
    inputs:
      imagen:
        description: Nombre de la imagen sin registry ni tag (por ejemplo solbeet-plataforma-api).
        type: string
        required: true
      contexto:
        description: Directorio de contexto del build, relativo a la raíz del repo.
        type: string
        default: backend
      dockerfile:
        description: Ruta del Dockerfile. Vacío = <contexto>/Dockerfile.
        type: string
        default: ""
      plataformas:
        description: Plataformas del build, separadas por coma.
        type: string
        default: linux/amd64
      publicar:
        description: false = solo construye (sirve para probar el Dockerfile en un PR).
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  imagen:
    name: imagen
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Login a ghcr.io
        if: inputs.publicar
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tags y labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ inputs.imagen }}
          flavor: |
            latest=false
          tags: |
            type=semver,pattern={{version}}
            type=sha,prefix=sha-,format=short
      - name: Build y push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ inputs.contexto }}
          file: ${{ inputs.dockerfile != '' && inputs.dockerfile || format('{0}/Dockerfile', inputs.contexto) }}
          platforms: ${{ inputs.plataformas }}
          push: ${{ inputs.publicar }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false
